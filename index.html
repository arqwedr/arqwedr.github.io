<style>
/* Layout: hoja de CV centrada; encabezado arriba, dos columnas (experiencia | perfil), carta al final */
:root{
  --bg:#ffffff; --sheet:#ffffff; --ink:#1e1f20; --muted:#5b5d60; --faint:#8b8d90; --rule:#c9cacc; --accent:#3a3d42;
  --font:'Lato','Carlito','Helvetica Neue',Arial,sans-serif;
  --fs-body:.74rem; --fs-small:.7rem; --fs-sec:1.18rem; --fs-name:1.9rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181a;--sheet:#202124;--ink:#ececea;--muted:#a9abae;--faint:#7d7f83;--rule:#3a3c40;--accent:#d6d7d9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--sheet:#202124;--ink:#ececea;--muted:#a9abae;--faint:#7d7f83;--rule:#3a3c40;--accent:#d6d7d9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:flex-end;gap:6px}
.lang{font:700 .72rem var(--font);letter-spacing:.08em;background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;cursor:pointer}
.dl{text-decoration:none;display:inline-flex;align-items:center}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.lang:focus-visible,.ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{background:var(--bg);border-radius:0;padding:clamp(20px,4vw,40px)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.hd>div{min-width:0}
.name{font-weight:300;font-size:var(--fs-name);letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.98rem;margin:6px 0 0}
.ct{color:var(--muted);font-size:var(--fs-small);margin:0}
.ct.first{margin-top:8px}
.photo{width:96px;height:96px;border-radius:50%;object-fit:cover;flex-shrink:0;max-width:100%}
.cols{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:clamp(18px,3vw,34px);margin-top:22px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.hd{flex-direction:column-reverse}.photo{width:84px;height:84px}}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-sec);font-weight:700;letter-spacing:.08em;
  border-bottom:1px solid var(--rule);padding-bottom:4px;margin:20px 0 8px}
.col>.sec:first-child{margin-top:0}
.job{margin-top:10px}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.8rem}
.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:var(--fs-small)}
.row>span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
ul{margin:3px 0 0;padding-left:16px}li{margin:2px 0}
strong{font-weight:700}
.ic{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .18s}
.ic svg{width:12px;height:12px}
.ic[aria-expanded="true"]{transform:rotate(180deg);color:var(--bg);background:var(--ink);border-color:var(--ink)}
.ic:hover{background:var(--ink);color:var(--bg)}
.det{border-left:2px solid var(--rule);padding:3px 0 3px 10px;margin-top:6px;color:var(--muted);font-size:.74rem;line-height:1.4}
.sb,.xd{border-left:2px solid var(--rule);padding-left:9px;margin-top:4px}
.xd{border-left-color:var(--muted)}
.sb ul,.xd ul{margin-top:0}
.lbl{font-weight:700;color:var(--muted);font-size:.72rem;letter-spacing:.08em;margin:8px 0 1px}
.pr{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pr>span:first-child{min-width:0}
.pr>span:last-child{white-space:nowrap;color:var(--muted);font-size:var(--fs-small);font-variant-numeric:tabular-nums}
.pd{color:var(--muted);font-size:.74rem;line-height:1.4;margin:1px 0 4px;padding-left:10px;border-left:2px solid var(--rule)}
.letter p{max-width:72ch;margin:0 0 11px;line-height:1.65;font-size:.78rem}
.letter strong{font-size:.86rem}
.sign{margin-top:4px}
.firma{display:block;width:150px;max-width:100%;height:auto;margin-top:34px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .firma{filter:invert(1)}}
:root[data-theme="dark"] .firma{filter:invert(1)}
@media (prefers-reduced-motion:reduce){.ic{transition:none}}
</style>
